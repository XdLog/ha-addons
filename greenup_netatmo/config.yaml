name: "Green'Up Netatmo"
version: "0.2.5"
slug: greenup_netatmo
description: "Borne Legrand Green'Up Home (NLEVSE) via l'API Netatmo, publiée en MQTT avec découverte"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
services:
  - "mqtt:need"
options:
  netatmo_email: ""
  netatmo_password: ""
  session_token: ""
  client_id: ""
  client_secret: ""
  refresh_token: ""
  auth_code: ""
  redirect_uri: "https://localhost"
  home_id: ""
  module_id: ""
  scan_interval: 60
  scan_interval_idle: 300
  debug: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  netatmo_email: str?
  netatmo_password: password?
  session_token: password?
  client_id: str?
  client_secret: password?
  refresh_token: password?
  auth_code: str?
  redirect_uri: str?
  home_id: str?
  module_id: str?
  scan_interval: int(30,3600)
  scan_interval_idle: int(60,3600)
  debug: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
